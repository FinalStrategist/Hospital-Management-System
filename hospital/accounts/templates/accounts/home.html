{% extends 'accounts/base.html' %}

{% block content %}
<style>
    /* --- CSS Variables for Easy Theming --- */
    :root {
        --primary-glow: rgba(0, 180, 255, 0.7);
        --secondary-glow: rgba(140, 82, 255, 0.7);
        --glass-bg: rgba(20, 30, 40, 0.25);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-border-hover: rgba(255, 255, 255, 0.25);
        --text-primary: rgba(255, 255, 255, 0.95);
        --text-secondary: rgba(255, 255, 255, 0.7);
        --card-blur: 12px;
    }

    /* --- Page Background with Animated Particles --- */
    body {
        background: black !important; /* Ensure base is black */
        margin: 0;
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
    }

    /* Animated background overlay */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 50%, rgba(30, 100, 150, 0.4) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(100, 60, 180, 0.3) 0%, transparent 50%),
                    repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 8px);
        z-index: -2;
        animation: slowShift 30s infinite alternate ease-in-out;
    }

    /* Animated "pulse" line (subtle ECG) */
    body::after {
        content: "";
        position: fixed;
        bottom: 30px;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--primary-glow), var(--secondary-glow), transparent);
        filter: blur(3px);
        opacity: 0.3;
        z-index: -1;
        animation: pulseMove 8s infinite linear;
    }

    @keyframes slowShift {
        0% { transform: scale(1) rotate(0deg); opacity: 0.8; }
        100% { transform: scale(1.2) rotate(1deg); opacity: 1; }
    }

    @keyframes pulseMove {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    /* --- Main Content Container --- */
    .home-container {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        perspective: 1000px; /* Gira a 3D hatást ad a hover effektekhez */
        animation: fadeInUp 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    /* --- The Main Glass Card --- */
    .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(var(--card-blur));
        -webkit-backdrop-filter: blur(var(--card-blur));
        border: 1px solid var(--glass-border);
        border-radius: 40px; /* Kerekítettebb sarkok a prémium megjelenésért */
        padding: 3.5rem 5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        text-align: center;
        max-width: 900px;
        width: 100%;
        transition: transform 0.4s ease, border-color 0.3s ease, box-shadow 0.4s ease;
        position: relative;
        overflow: hidden; /* A lebegő orrokhoz kell */
        transform-style: preserve-3d;
    }

    /* Subtle 3D hover effect on the main card */
    .glass-card:hover {
        transform: translateY(-5px) rotateX(1deg) rotateY(0.5deg);
        border-color: var(--glass-border-hover);
        box-shadow: 0 35px 60px -15px rgba(0, 180, 255, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
    }

    /* Floating "orb" decorations behind the card (layered glass) */
    .glass-card::before,
    .glass-card::after {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle at 30% 30%, rgba(100, 200, 255, 0.3), transparent 70%);
        border-radius: 50%;
        z-index: -1;
        filter: blur(40px);
        opacity: 0.5;
        transition: all 0.6s ease;
    }

    .glass-card::before {
        top: -80px;
        left: -80px;
        background: radial-gradient(circle, rgba(0, 180, 255, 0.4), transparent 70%);
        animation: floatOrb 15s infinite alternate ease-in-out;
    }

    .glass-card::after {
        bottom: -80px;
        right: -80px;
        background: radial-gradient(circle, rgba(140, 82, 255, 0.4), transparent 70%);
        animation: floatOrb 18s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatOrb {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 30px) scale(1.2); }
    }

    /* --- Typography with Animation --- */
    .glass-card h1 {
        font-size: 3.5rem;
        font-weight: 600;
        background: linear-gradient(135deg, #ffffff 0%, #aaccff 50%, #ffffff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
        animation: fadeInUp 0.8s 0.2s both;
        text-shadow: 0 2px 10px rgba(0, 180, 255, 0.3);
    }

    .glass-card p {
        font-size: 1.3rem;
        color: var(--text-secondary);
        margin-bottom: 2.5rem;
        animation: fadeInUp 0.8s 0.4s both;
        border-bottom: 1px dashed rgba(255,255,255,0.2);
        padding-bottom: 2rem;
        display: inline-block;
    }

    /* --- Role Icons (subtle ecosystem hint) --- */
    .role-icons {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-bottom: 2.5rem;
        animation: fadeInUp 0.8s 0.6s both;
    }

    .role-icon-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        opacity: 0.5;
        transition: all 0.3s ease;
        filter: grayscale(0.8);
    }

    .role-icon-item i {
        font-size: 1.8rem;
        color: white;
        background: rgba(255,255,255,0.1);
        padding: 0.8rem;
        border-radius: 30px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255,255,255,0.1);
        transition: all 0.3s ease;
    }

    .role-icon-item span {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-secondary);
    }

    .role-icon-item:hover {
        opacity: 1;
        filter: grayscale(0);
        transform: translateY(-3px);
    }

    .role-icon-item:hover i {
        background: var(--primary-glow);
        border-color: white;
        box-shadow: 0 0 20px var(--primary-glow);
    }

    /* --- Button Group --- */
    .button-group {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        margin-bottom: 2rem;
        animation: fadeInUp 0.8s 0.8s both;
    }

    /* Premium Glass Buttons */
    .btn-glass {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 0.9rem 2.5rem;
        border-radius: 50px;
        color: white;
        font-weight: 500;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
    }

    .btn-glass::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s ease;
    }

    .btn-glass:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.4);
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3), 0 0 20px var(--primary-glow);
    }

    .btn-glass:hover::before {
        left: 100%;
    }

    /* Specific button for admin */
    .btn-glass.admin {
        background: rgba(140, 82, 255, 0.2);
        border-color: rgba(140, 82, 255, 0.4);
    }
    .btn-glass.admin:hover {
        background: rgba(140, 82, 255, 0.4);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3), 0 0 20px var(--secondary-glow);
    }

    /* --- Premium Social Icons --- */
    .social-section {
        margin-top: 2rem;
        animation: fadeInUp 0.8s 1s both;
    }

    .social-glass {
        display: flex;
        justify-content: center;
        gap: 1rem;
    }

    .social-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 45px;
        height: 45px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 1.3rem;
        transition: all 0.3s ease;
        text-decoration: none;
    }

    .social-icon:hover {
        transform: translateY(-5px) scale(1.1);
        border-color: transparent;
    }

    /* Brand colors on hover */
    .social-icon:hover .fa-facebook-f { color: #1877f2; } /* Facebook */
    .social-icon:hover .fa-twitter { color: #1da1f2; } /* Twitter/X */
    .social-icon:hover .fa-instagram { color: #e4405f; } /* Instagram */
    .social-icon:hover .fa-linkedin-in { color: #0077b5; } /* LinkedIn */

    .social-icon i {
        transition: color 0.3s ease;
    }

    .social-icon:hover {
        background: rgba(0, 0, 0, 0.6);
        border-color: rgba(255, 255, 255, 0.3);
    }

    /* --- Animations --- */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .glass-card {
            padding: 2rem 1.5rem;
        }
        .glass-card h1 {
            font-size: 2.2rem;
        }
        .button-group {
            flex-direction: column;
            align-items: center;
        }
        .btn-glass {
            width: 100%;
            max-width: 250px;
        }
    }
</style>

<div class="home-container">
    <div class="glass-card">
        <h1>Hospital Management System</h1>
        <p>Seamless care, connected teams, better outcomes</p>

        <!-- Subtle role icons to hint at different dashboards -->
        <div class="role-icons">
            <div class="role-icon-item" title="Admin">
                <i class="fas fa-user-cog"></i>
                <span>Admin</span>
            </div>
            <div class="role-icon-item" title="Doctor">
                <i class="fas fa-user-md"></i>
                <span>Doctor</span>
            </div>
            <div class="role-icon-item" title="Receptionist">
                <i class="fas fa-phone-alt"></i>
                <span>Reception</span>
            </div>
            <div class="role-icon-item" title="Patient">
                <i class="fas fa-user-injured"></i>
                <span>Patient</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
            <a href="{% url 'login' %}" class="btn-glass">🔐 Login</a>
            <a href="{% url 'register' %}" class="btn-glass">📝 Register</a>
            {% if user.is_staff %}
                <a href="/admin" class="btn-glass admin">⚙️ Admin Site</a>
            {% endif %}
        </div>

        <!-- Premium Social Media Icons -->
        <div class="social-section">
            <div class="social-glass">
                <a href="#" class="social-icon" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-icon" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
    </div>
</div>
